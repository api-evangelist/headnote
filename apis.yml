aid: headnote
name: Headnote
description: >-
  Headnote is a legal payments and accounts-receivable platform built specifically
  for law firms. Founded in 2016 by attorney Sarah Schaaf, it lets firms accept
  trust-compliant credit card and eCheck (ACH) payments via shareable payment links
  and a hosted client payment portal, then automates collections, AR tracking, and
  client NPS/satisfaction reporting. Headnote is designed to be 100% compliant with
  IOLTA rules, the ABA Model Rules of Professional Conduct, and lawyer trust/operating
  account requirements across all 50 states, and integrates with existing billing and
  practice-management software by attaching a Headnote payment link to invoices. Card
  and bank data are tokenized with Stripe and Plaid and the platform runs on AWS with
  PCI-compliant, encrypted-at-rest-and-in-transit infrastructure. Headnote was acquired
  by ASG LegalTech (an Alpine Investors platform, alongside PracticePanther, Bill4Time,
  and MerusCase) in 2020. It was surfaced in the API Evangelist network as a portfolio
  company of Uncork Capital. Headnote does not publish a public developer API, OpenAPI,
  or developer portal; this profile is an identity record.
